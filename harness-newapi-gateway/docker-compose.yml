# Local-dev New API gateway for digital-human / Harness.
# Upstream: https://github.com/QuantumNous/new-api
# Quick start: cp .env.example .env && docker compose up -d
# UI / API: http://127.0.0.1:3000

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: harness-new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-change_me_local}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=harness-new-api-local
      - DEFAULT_LANGUAGE=zh-CN
    depends_on:
      - redis
      - postgres
    networks:
      - harness-newapi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: harness-new-api-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me_local}"]
    networks:
      - harness-newapi

  postgres:
    image: postgres:15
    container_name: harness-new-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - harness-newapi

volumes:
  pg_data:

networks:
  harness-newapi:
    driver: bridge
